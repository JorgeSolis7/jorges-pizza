services:
  api:
    build: ./backend
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Store__Currency: PEN
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        # The api image declares a HEALTHCHECK on /health.
        condition: service_healthy
    restart: unless-stopped
